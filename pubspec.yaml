name: kamui
description: "Kamui — Untouchable Serverless Communication over I2P"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ─── State Management ─────────────────────────────
  flutter_riverpod: ^2.6.1

  # ─── UI / Fonts / Persistence ─────────────────────
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2

  # ─── Security & Biometrics ─────────────────────────
  local_auth: ^2.3.0

  # ─── QR Code Generation & Scanning ────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # ─── Notifications ────────────────────────────────
  flutter_local_notifications: ^17.2.4

  # ─── Local Storage ────────────────────────────────
  sqflite: ^2.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.5

  # ─── Secure Key Storage ───────────────────────────
  flutter_secure_storage: ^9.2.4

  # ─── Cryptography (AES-256-GCM message encryption)
  pointycastle: ^3.9.1
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
