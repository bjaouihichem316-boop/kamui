# Kamui CI — analyze, test & debug-APK build on every push to main and PR.
#
# The debug APK build (no signing secrets required) catches Gradle/namespace
# regressions; analyze and test gate all Dart-level changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Analyze • Test • Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17 — required by the Android Gradle toolchain.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter stable, pinned to the version matching pubspec
      # environment sdk ^3.12.2 (Dart 3.12.2 ships with Flutter 3.44.x).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
